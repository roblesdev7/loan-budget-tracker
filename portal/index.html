<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="José Robles — Apps personales" />
    <title>José Robles</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(160deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        min-height: 100vh;
        color: #e2e8f0;
        line-height: 1.5;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 3rem 1.5rem 4rem;
      }
      header {
        text-align: center;
        margin-bottom: 3rem;
      }
      header h1 {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }
      header p {
        margin-top: 0.5rem;
        font-size: 0.95rem;
        color: #94a3b8;
      }
      .grid {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .app-card {
        display: block;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 1.25rem 1.5rem;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.15s;
      }
      .app-card:hover,
      .app-card:focus-visible {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
        outline: none;
      }
      .app-card .icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .app-card h2 {
        font-size: 1.1rem;
        font-weight: 700;
        color: #f1f5f9;
      }
      .app-card p {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-top: 0.25rem;
      }
      .app-card .tag {
        display: inline-block;
        margin-top: 0.75rem;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.2rem 0.5rem;
        border-radius: 0.375rem;
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
      }
      .app-card.soon {
        opacity: 0.5;
        pointer-events: none;
      }
      .app-card.soon .tag {
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
      }
      footer {
        text-align: center;
        margin-top: 3rem;
        font-size: 0.75rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>José Robles</h1>
        <p>Apps personales · joseroblesm.com</p>
      </header>

      <div class="grid">
        <a class="app-card" href="/finance/">
          <div class="icon">💰</div>
          <h2>Loan &amp; Budget</h2>
          <p>
            Control de ingresos, gastos y deudas. Préstamos, tarjetas y pagos
            fijos mensuales.
          </p>
          <span class="tag">Disponible</span>
        </a>

        <div class="app-card soon">
          <div class="icon">🚀</div>
          <h2>Próximamente</h2>
          <p>Más apps en camino. Agrega enlaces aquí cuando estén listas.</p>
          <span class="tag">Pronto</span>
        </div>
      </div>

      <footer>© 2026 José Robles</footer>
    </div>
  </body>
</html>
